<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <!-- Include the CesiumJS JavaScript and CSS files -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/CesiumUnminified/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
</head>

<body style='width: 100%; height: 100%'>
    
    <div id="rightSide" style="
    width: 49.9%;
    height: 100%;
    top: 0;
    right: 0;
    position: absolute;">
        <pre id="logger" style="
    padding-left:  1em;
    border-left:  1em;
    border-left-style: outset;">
        </pre>
    </div>
    
    <div id="leftSide" ondblclick='resetView()' style="width: 49.9%;">
        <div id="cesiumContainer" style="width: 100%; aspect-ratio: 16 / 9; max-height: 40%;"></div>
        <div id="threeContainer" style="width: 100%;"></div>
    </div>
    
    <script type="module">
        // Your access token can be found at: https://ion.cesium.com/tokens.
        // Replace `your_access_token` with your Cesium ion access token.

        // Cesium.Ion.defaultAccessToken = 'your_access_token';

        const endUserOptions = queryToObject(window.location.search.substring(1));

        const fallBackUrl = "https://andreasplesch.github.io/3d-tiles-examples/migration/output_from_1.0/Tilesets/TilesetOfTilesets/tileset.json";

        const url = endUserOptions?.url || fallBackUrl;

        const threeDTilesRendererUrl = 'https://nasa-ammos.github.io/3DTilesRendererJS/example/bundle/index.html#' + url;
        const threeContainer = document.querySelector('#threeContainer');
        threeContainer.innerHTML = `<iframe style='width: 100%; aspect-ratio: 16 / 9; max-height: 40%;' src=${threeDTilesRendererUrl}></iframe>`;

        const viewer = new Cesium.Viewer("cesiumContainer", {
              baseLayer: Cesium.ImageryLayer.fromProviderAsync(
                Cesium.ArcGisMapServerImageryProvider.fromBasemapType(
                  Cesium.ArcGisBaseMapType.SATELLITE
                )
              ),
        });
        viewer.extend(Cesium.viewerCesiumInspectorMixin);
        viewer.extend(Cesium.viewerCesium3DTilesInspectorMixin);
        
        const scene = viewer.scene;

        //let tileInspector = new Cesium.Cesium3DTilesInspector("cesiumContainer", scene);
        
        const camera = scene.camera;
        const maxDistanceFromCore = 100000; //100 km
        
        let boundingSphere, tileset;
        try {
            tileset = await Cesium.Cesium3DTileset.fromUrl(url);
            tileset.style = new Cesium.Cesium3DTileStyle({ pointSize: "10" });
            boundingSphere = tileset.boundingSphere;
            if ( Cesium.Cartesian3.magnitude(boundingSphere.center) < maxDistanceFromCore )
            {
                scene.globe.show = false;
                //scene.screenSpaceCameraController.zoomFactor /= 10000000;
                //scene.screenSpaceCameraController.inertiaZoom = 0;
                scene.screenSpaceCameraController.enableCollisionDetection = false;
                //scene.screenSpaceCameraController.minimumZoomDistance = -6377000;
                //scene.screenSpaceCameraController.maximumZoomDistance = 1;
                // scene.screenSpaceCameraController._globe = null;
            }
            viewer.scene.primitives.add(tileset);
            camera.flyToBoundingSphere(boundingSphere);
            camera.completeFlight();
            const tilesetjson = await fetch(url).then((response) => response.text());//.then((text) => text );
            document.querySelector('#logger').textContent = tilesetjson;
        } catch (error) {
            console.log(`Error loading tileset: ${error}`);
        }

        window.resetView = function()
        {
            camera.flyToBoundingSphere(tileset.boundingSphere);
            camera.completeFlight(); // necessary when close to earth center
            camera.zoomOut(tileset.boundingSphere.radius);          
            console.log(viewer.scene.camera.position);
        }

        //============================================================================
        // Batch table and metadata handling
        
        // Create an HTML element that will serve as the
        // tooltip that displays the metadata information
        function createTooltip() {
            const tooltip = document.createElement("div");
            viewer.container.appendChild(tooltip);
            tooltip.style.backgroundColor = "#808080AA";
            tooltip.style.position = "absolute";
            tooltip.style.left = "0";
            tooltip.style.top = "0";
            tooltip.style.padding = "14px";
            tooltip.style["pointer-events"] = "none";
            tooltip.style["block-size"] = "fit-content";
            return tooltip;
          }
          const tooltip = createTooltip();
        
          // Show the given HTML content in the tooltip
          // at the given screen position
          function showTooltip(screenX, screenY, htmlContent) {
            tooltip.style.display = "block";
            tooltip.style.left = `${screenX}px`;
            tooltip.style.top = `${screenY}px`;
            tooltip.innerHTML = htmlContent;
          }
        
          // Create an HTML string that contains information
          // about the given metadata, under the given title
          function createMetadataHtml(title, metadata) {
            if (!Cesium.defined(metadata)) {
              return `(No ${title})<br>`;
            }
            const propertyKeys = metadata.getPropertyIds();
            if (!Cesium.defined(propertyKeys)) {
              return `(No properties for ${title})<br>`;
            }
            let html = `<b>${title}:</b><br>`;
            for (let i = 0; i < propertyKeys.length; i++) {
              const propertyKey = propertyKeys[i];
              const propertyValue = metadata.getProperty(propertyKey);
              html += `&nbsp;&nbsp;${propertyKey} : ${propertyValue}<br>`;
            }
            return html;
          }
        
          // Install the handler that will check the element that is
          // under the mouse cursor when the mouse is moved, and
          // add any metadata that it contains to the label.
          const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
          handler.setInputAction(function (movement) {
            let tooltipText = "";
            const picked = viewer.scene.pick(movement.endPosition);
        
            if (picked) {
                if (picked instanceof Cesium.Cesium3DTileFeature) {
                    tooltipText += createMetadataHtml("Batch table", picked);
                }
            }
        
            const tilesetMetadata = picked?.content?.tileset?.metadata;
            tooltipText += createMetadataHtml("Tileset metadata", tilesetMetadata);
        
            const tileMetadata = picked?.content?.tile?.metadata;
            tooltipText += createMetadataHtml("Tile metadata", tileMetadata);
        
            const groupMetadata = picked?.content?.group?.metadata;
            tooltipText += createMetadataHtml("Group metadata", groupMetadata);
        
            const contentMetadata = picked?.content?.metadata;
            tooltipText += createMetadataHtml("Content metadata", contentMetadata);
        
            const screenX = movement.endPosition.x;
            const screenY = movement.endPosition.y;
            if (picked) showTooltip(screenX, screenY, tooltipText);
          }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        /**
     * Parses a query string into an object, where the keys and values of the object are the
     * name/value pairs from the query string, decoded. If a name appears multiple times,
     * the value in the object will be an array of values.
     * @function queryToObject
     *
     * @param {string} queryString The query string.
     * @returns {object} An object containing the parameters parsed from the query string.
     *
     *
     * @example
     * const obj = Cesium.queryToObject('key1=some%20value&key2=a%2Fb&key3=x&key3=y');
     * // obj will be:
     * // {
     * //   key1 : 'some value',
     * //   key2 : 'a/b',
     * //   key3 : ['x', 'y']
     * // }
     *
     * @see objectToQuery
     */
        function queryToObject(queryString) {
            //>>includeStart('debug', pragmas.debug);
            //   if (!defined(queryString)) {
            //     throw new DeveloperError("queryString is required.");
            //   }
            //   //>>includeEnd('debug');

            const result = {};
            if (queryString === "") {
                return result;
            }
            const parts = queryString.replace(/\+/g, "%20").split(/[&;]/);
            for (let i = 0, len = parts.length; i < len; ++i) {
                const subparts = parts[i].split("=");

                const name = decodeURIComponent(subparts[0]);
                let value = subparts[1];
                if (value) {
                    value = decodeURIComponent(value);
                } else {
                    value = "";
                }

                const resultValue = result[name];
                if (typeof resultValue === "string") {
                    // expand the single value to an array
                    result[name] = [resultValue, value];
                } else if (Array.isArray(resultValue)) {
                    resultValue.push(value);
                } else {
                    result[name] = value;
                }
            }
            return result;
        }
    </script>
</body>
</html>
